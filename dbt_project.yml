name: pharmacy_analytics
version: '1.0.0'
config-version: 2

profile: pharmacy_analytics

model-paths: ["models"]
seed-paths:  ["seeds"]
test-paths:  ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  pharmacy_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  pharmacy_analytics:
    +schema: raw

vars:
  start_date: '2022-01-01'
  end_date:   '2024-12-31'
